<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1035"/>
      <stop offset="1" stop-color="#0b2a3f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aa5cc3"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <!-- stacked film frames, the last one being cut away -->
  <g transform="translate(150 150)">
    <rect x="0" y="40" width="150" height="200" rx="14" fill="#ffffff" opacity=".10"/>
    <rect x="40" y="20" width="150" height="200" rx="14" fill="#ffffff" opacity=".18"/>
    <rect x="80" y="0" width="150" height="200" rx="14" fill="url(#accent)"/>
    <path d="M128 70 L198 100 L128 130 Z" fill="#ffffff" opacity=".95"/>
    <!-- dashed cut line -->
    <line x1="60" y1="250" x2="232" y2="9" stroke="#ffffff" stroke-width="6" stroke-dasharray="16 12" stroke-linecap="round" opacity=".85"/>
    <!-- shears -->
    <g transform="translate(255 -22) rotate(-144)" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round">
      <circle cx="-26" cy="58" r="20"/>
      <circle cx="26" cy="58" r="20"/>
      <path d="M-14 42 L18 -30"/>
      <path d="M14 42 L-18 -30"/>
    </g>
  </g>
  <text x="480" y="262" font-family="Inter, sans-serif" font-weight="700" font-size="76" fill="#ffffff">Media</text>
  <text x="480" y="342" font-family="Inter, sans-serif" font-weight="700" font-size="76" fill="url(#accent)">Pruner</text>
</svg>
