name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['manifest.json', '**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.MediaPruner.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.MediaPruner.sln -c Release --no-restore

      - name: Test
        run: dotnet test Jellyfin.Plugin.MediaPruner.sln -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.MediaPruner
          path: Jellyfin.Plugin.MediaPruner/bin/Release/net10.0/Jellyfin.Plugin.MediaPruner.dll
